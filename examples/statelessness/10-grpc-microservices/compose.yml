# statelessness/10-grpc-microservices — the gRPC capstone.
#
# Three services compose the end-to-end story:
#   postgres     customers + products + idempotency (SCLorg image)
#   tax-svc      the outbound gRPC upstream (tax.v1.TaxService on :50052)
#   pricing-svc  the capstone (pricing.v1.Pricing on :50051) — looks up the
#                customer + product prices in Postgres, calls tax-svc over
#                gRPC with the request deadline propagated, returns a priced
#                order; idempotent on the client key.
#
# tax-svc and pricing-svc are the SAME image (built once via pricing-svc)
# running different commands.
#
# Bring up:   podman compose -f compose.yml up --build
# Drive it:   ./demo.sh
# Tear down:  ./demo.sh --clean

services:
  postgres:
    image: quay.io/sclorg/postgresql-16-c9s:latest
    container_name: stateless-10-postgres
    environment:
      POSTGRESQL_USER: pricing
      POSTGRESQL_PASSWORD: pricing
      POSTGRESQL_DATABASE: pricing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

  tax-svc:
    build:
      context: .
      dockerfile: Containerfile
    image: cpp-tut/stateless-10-grpc-microservices:latest
    container_name: stateless-10-tax
    command: ["/usr/local/bin/tax-svc"]
    environment:
      LISTEN_ADDR: "0.0.0.0:50052"
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe", "localhost:50052"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

  pricing-svc:
    image: cpp-tut/stateless-10-grpc-microservices:latest
    container_name: stateless-10-pricing
    depends_on:
      postgres:
        condition: service_healthy
      tax-svc:
        condition: service_healthy
    environment:
      LISTEN_ADDR: "0.0.0.0:50051"
      PG_CONNINFO: "postgresql://pricing:pricing@postgres:5432/pricing"
      PG_POOL_SIZE: "8"
      TAX_SERVICE_ADDR: "tax-svc:50052"
      DEFAULT_DEADLINE_MS: "2000"
    command: ["/usr/local/bin/pricing-svc"]
    ports:
      - "127.0.0.1:50051:50051"   # gRPC Pricing
    healthcheck:
      test: ["CMD", "/usr/local/bin/health-probe", "localhost:50051", "pricing.v1.Pricing"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
