// The order-pricing service — the capstone's public API (Doc 10).
//
// PriceOrder takes a customer and line items, looks up the customer in
// PostgreSQL, prices each item, calls the tax service over gRPC, and
// returns a fully-priced order. It carries an idempotency key (so a client
// retry is safe) and a correlation id (propagated to downstream calls and
// into the request span).

syntax = "proto3";

package pricing.v1;

service Pricing {
  rpc PriceOrder(PriceOrderRequest) returns (PriceOrderResponse);
}

message PriceOrderRequest {
  string idempotency_key = 1;
  string customer_id = 2;
  repeated LineItem line_items = 3;
  string correlation_id = 4;
}

message LineItem {
  string product_id = 1;
  int32  quantity = 2;
}

message PriceOrderResponse {
  string order_id = 1;
  int64  subtotal_cents = 2;
  int64  tax_cents = 3;
  int64  total_cents = 4;
}
