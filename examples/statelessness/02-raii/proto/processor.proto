// statelessness/02-raii — RequestProcessor service.
//
// A deliberately small service whose only job is to make the
// RequestContext RAII lifecycle visible. The `mode` field selects
// which exit path the handler takes, so the demo can prove that the
// RequestContext destructor fires on every one of them.

syntax = "proto3";

package statelessraii;

service RequestProcessor {
  // Process runs the request through a handler that builds a
  // RequestContext (RAII) on entry. The `mode` field drives the
  // exit path:
  //   "ok"     → normal processing, returns OK
  //   "reject" → early return on a validation failure, before the
  //              work completes (RAII still releases everything)
  //   "throw"  → throws mid-handler; the handler boundary maps the
  //              exception to grpc::StatusCode::INTERNAL (RAII still
  //              releases everything during stack unwinding)
  rpc Process(ProcessRequest) returns (ProcessResponse);
}

message ProcessRequest {
  string payload = 1;
  string mode = 2;
}

message ProcessResponse {
  // The request id minted by the RequestContext for this request.
  string request_id = 1;
  string result = 2;
  // Wall-clock time the handler spent between RequestContext
  // construction and destruction, in microseconds.
  int64 handler_duration_micros = 3;
}
