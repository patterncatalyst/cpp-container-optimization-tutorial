# statelessness/02-raii brings up a single service:
#   raii-svc — gRPC RequestProcessor on :50051, healthz on :8080
#
# No observability stack: this example teaches the RequestContext RAII
# lifecycle, which is visible in the service's own stdout. (The
# observability demos under examples/demo-04 wire the LGTM stack;
# the compendium's later examples reuse it where it earns its place.)
#
# Bring up:   podman compose -f compose.yml up --build
# Drive it:   ./demo.sh
# Tear down:  ./demo.sh --clean   (or: podman compose -f compose.yml down -v)

services:
  raii-svc:
    build:
      context: .
      dockerfile: Containerfile
    image: cpp-tut/stateless-02-raii:latest
    container_name: stateless-02-raii
    ports:
      - "127.0.0.1:50051:50051"   # gRPC RequestProcessor
      - "127.0.0.1:18402:8080"    # healthz
    # Read-only root filesystem: this service writes nothing to disk
    # (logs go to stdout). Demonstrates the ephemeral-filesystem
    # discipline early; the dedicated 08-ephemeral-filesystem example
    # goes deeper. tmpfs is provided for /tmp in case any transitive
    # library wants scratch space.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
