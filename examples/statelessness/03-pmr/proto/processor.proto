// statelessness/03-pmr — MemoryProcessor service.
//
// Demonstrates PMR's monotonic_buffer_resource as the request arena:
// "the request brings its own memory, all releases together." The
// `mode` field selects what the handler does:
//   "arena" → allocate per-request scratch from a layered arena
//             (monotonic_buffer_resource backed by an
//             unsynchronized_pool_resource), then bulk-release at
//             scope end
//   "bench" → time arena bulk-release vs per-object new/delete for a
//             batch of allocations, returning the comparison so the
//             O(1)-vs-O(N) asymmetry is visible

syntax = "proto3";

package statelesspmr;

service MemoryProcessor {
  rpc Process(ProcessRequest) returns (ProcessResponse);
}

message ProcessRequest {
  string payload = 1;
  string mode = 2;
  // For bench mode: how many allocations to make on each side.
  // Ignored by arena mode. Defaults to 10000 if zero.
  int32 iterations = 3;
}

message ProcessResponse {
  string request_id = 1;
  string result = 2;
  int64 handler_duration_micros = 3;
  // Populated by bench mode only.
  int64 arena_micros = 4;
  int64 perobject_micros = 5;
}
