# statelessness/11-build-tooling — the vendored-helpers demo.
#
# One service that builds the image and runs helper-demo unconstrained.
# The interesting part is sweeping the SAME image under different cgroup
# caps, which `./demo.sh` does with `podman run --cpus/--memory` — compose
# fixes a service's limits, so the cap sweep lives in the demo script.
#
# Build:      podman compose -f compose.yml build
# Default run: podman compose -f compose.yml up
# Full demo:  ./demo.sh   (build + tests + cap sweep)

services:
  helper-demo:
    build:
      context: .
      dockerfile: Containerfile
    image: cpp-tut/stateless-11-build-tooling:latest
    container_name: stateless-11-helper-demo
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
