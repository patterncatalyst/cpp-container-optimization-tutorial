# statelessness/07-state-externalization brings up two services:
#   postgres   — authoritative order state (CentOS Stream 9 SCLorg image)
#   order-svc  — gRPC OrderService on :50051, healthz on :8080
#
# order-svc waits for Postgres to be healthy (depends_on) AND retries the
# connection at startup, so it tolerates the database still coming up.
#
# Bring up:   podman compose -f compose.yml up --build
# Drive it:   ./demo.sh
# Tear down:  ./demo.sh --clean

services:
  postgres:
    # CentOS Stream 9 SCLorg PostgreSQL — Red Hat ecosystem, no auth
    # needed (a sanctioned exception, like the LGTM stack: UBI ships no
    # ready-to-run Postgres server image).
    image: quay.io/sclorg/postgresql-16-c9s:latest
    container_name: stateless-07-postgres
    environment:
      POSTGRESQL_USER: orders
      POSTGRESQL_PASSWORD: orders
      POSTGRESQL_DATABASE: orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"

  order-svc:
    build:
      context: .
      dockerfile: Containerfile
    image: cpp-tut/stateless-07-state-externalization:latest
    container_name: stateless-07-order-svc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_CONNINFO: "postgresql://orders:orders@postgres:5432/orders"
      PG_POOL_SIZE: "4"
    ports:
      - "127.0.0.1:50051:50051"   # gRPC OrderService
      - "127.0.0.1:18405:8080"    # healthz
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
