// statelessness/07-state-externalization — OrderService.
//
// The runnable companion to compendium Doc 07. Authoritative business
// state (orders) lives OUTSIDE the process, in PostgreSQL. The service
// itself holds only process-scoped infrastructure — a connection pool —
// and reaches the database through an RAII checkout per request.
//
// CreateOrder carries an idempotency_key so a client retry does not
// create a duplicate order: the database is the authoritative dedup
// point (a UNIQUE constraint on idempotency_key), and a replay returns
// the original order_id with idempotent_replay=true.

syntax = "proto3";

package statelessextern;

service OrderService {
  // Create an order. Idempotent on idempotency_key: a retry with the
  // same key returns the original order rather than creating another.
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  // Read an order back by id (demonstrates pool reuse for reads).
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
}

message CreateOrderRequest {
  string customer_id = 1;
  string item = 2;
  string idempotency_key = 3;  // required; the client's retry token
}

message GetOrderRequest {
  int64 order_id = 1;
}

message OrderResponse {
  int64 order_id = 1;
  string customer_id = 2;
  string item = 3;
  // True when this response replays an already-created order (the
  // idempotency key was seen before) rather than a fresh insert.
  bool idempotent_replay = 4;
}
