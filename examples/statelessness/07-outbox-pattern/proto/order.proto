// statelessness/07-outbox-pattern — OrderService (the producer).
//
// The runnable companion to Doc 07's "Outbox pattern" section. The
// producer's CreateOrder writes the order row AND an outbox row in ONE
// transaction; a separate relay publishes outbox rows to Kafka; an
// idempotent consumer applies them. This proto is just the producer's
// front door — identical in spirit to 07-state-externalization.

syntax = "proto3";

package statelessoutbox;

service OrderService {
  // Create an order. In one DB transaction this writes the order and an
  // outbox event; the relay publishes the event to Kafka afterwards.
  // Idempotent on idempotency_key (the order is deduped; so is the
  // event, since the outbox row is only written on a fresh insert).
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
}

message CreateOrderRequest {
  string customer_id = 1;
  string item = 2;
  string idempotency_key = 3;
}

message GetOrderRequest {
  int64 order_id = 1;
}

message OrderResponse {
  int64 order_id = 1;
  string customer_id = 2;
  string item = 3;
  bool idempotent_replay = 4;
}
