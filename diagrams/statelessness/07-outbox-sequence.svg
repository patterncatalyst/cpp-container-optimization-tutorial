<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="A downward sequence across five lifelines: client, order service, PostgreSQL, a relay, Kafka, and a consumer. In phase one the order service writes both the order row and an outbox event row inside a single PostgreSQL transaction, so there is no moment where the order exists but the event was lost. In phase two a relay selects unpublished outbox rows with FOR UPDATE SKIP LOCKED, produces each event to Kafka, waits for the broker acknowledgement, then marks the row published and commits; a crash before that commit re-publishes on the next pass, giving at-least-once delivery. In phase three the consumer applies each event with INSERT ON CONFLICT DO NOTHING and commits the Kafka offset only after the database write, so a duplicate delivery is a no-op and the end-to-end effect is exactly-once.">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e8e1d3" stroke-width="0.5"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2d2d"/>
    </marker>
    <marker id="arrowhead-r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrowhead-g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a8870"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#fdfbf7"/>
  <rect width="980" height="620" fill="url(#grid)" opacity="0.4"/>
  <text x="490" y="30" text-anchor="middle" style="font: 700 16px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Outbox pattern — atomic write, relay, idempotent consumer</text>
  <rect x="28" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="90" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Client</text>
  <line x1="90" y1="98" x2="90" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="188" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="250" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Order service</text>
  <line x1="250" y1="98" x2="250" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="368" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="430" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">PostgreSQL</text>
  <line x1="430" y1="98" x2="430" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="528" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="590" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Relay</text>
  <line x1="590" y1="98" x2="590" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="658" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="720" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Kafka</text>
  <line x1="720" y1="98" x2="720" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="788" y="64" width="124" height="34" rx="6" ry="6" fill="#e8f0fb" stroke="#4a73b8" stroke-width="1.5"/>
  <text x="850" y="84" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">Consumer</text>
  <line x1="850" y1="98" x2="850" y2="560" stroke="#cdbfa6" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="40" y="120" width="900" height="120" rx="4" ry="4" fill="#fbf6ee" stroke="#cdbfa6" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="52" y="138" text-anchor="start" style="font: 700 12px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">1 · atomic write</text>
  <rect x="40" y="255" width="900" height="175" rx="4" ry="4" fill="#fbf6ee" stroke="#cdbfa6" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="52" y="273" text-anchor="start" style="font: 700 12px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">2 · relay (at-least-once)</text>
  <rect x="40" y="445" width="900" height="120" rx="4" ry="4" fill="#fbf6ee" stroke="#cdbfa6" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="52" y="463" text-anchor="start" style="font: 700 12px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">3 · idempotent consumer</text>
  <line x1="90" y1="160" x2="250" y2="160" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="170" y="154" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">CreateOrder(key)</text>
  <rect x="335" y="178" width="190" height="48" rx="4" ry="4" fill="#f4d7cf" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="196" text-anchor="middle" style="font: 700 12px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">BEGIN  ·  one txn</text>
  <text x="430" y="212" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">INSERT order + INSERT outbox</text>
  <line x1="250" y1="200" x2="335" y2="200" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="430" y="240" text-anchor="middle" style="font: italic 700 11px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">COMMIT  → no lost-event window</text>
  <line x1="590" y1="300" x2="430" y2="300" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="510" y="294" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">SELECT … FOR UPDATE SKIP LOCKED</text>
  <line x1="590" y1="340" x2="720" y2="340" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="655" y="334" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">produce(event) · flush (ack)</text>
  <line x1="590" y1="392" x2="430" y2="392" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="510" y="386" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">mark published · COMMIT</text>
  <text x="590" y="416" text-anchor="middle" style="font: italic 700 11px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #c0392b;">crash before COMMIT → re-publish next pass</text>
  <line x1="720" y1="484" x2="850" y2="484" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="785" y="478" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">deliver event</text>
  <rect x="780" y="496" width="130" height="32" rx="4" ry="4" fill="#f4d7cf" stroke="#c0392b" stroke-width="1.2"/>
  <text x="845" y="516" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">ON CONFLICT</text>
  <line x1="850" y1="548" x2="720" y2="548" stroke="#2d2d2d" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)"/>
  <text x="785" y="542" text-anchor="middle" style="font: 400 10px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #444444;">commit offset AFTER db write</text>
  <rect x="180" y="578" width="620" height="36" rx="6" ry="6" fill="#d8e8df" stroke="#5a8870" stroke-width="1.5"/>
  <text x="490" y="598" text-anchor="middle" style="font: 700 13px -apple-system, system-ui, 'Segoe UI', sans-serif; fill: #1a1a1a;">at-least-once delivery + idempotent apply = exactly-once effect</text>
</svg>
